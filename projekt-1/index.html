<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projekt 1</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Projekt 1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--sunk:#F3F3F3;--ink:#000000;--mute:#6E6E6E;--line:#E2E2E2;--hair:#000000;
  --acc:#000000;--on:#FFFFFF;--acc2:#000000;--soft:#F3F3F3;
  --kraft:#2F54EB;--lauf:#FA541C;--swim:#0FA3A3;--food:#2E9E3A;
  --font:"SF Pro Display",system-ui,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#000000;--surface:#000000;--sunk:#161616;--ink:#FFFFFF;--mute:#9A9A9A;--line:#2A2A2A;--hair:#FFFFFF;
  --acc:#FFFFFF;--on:#000000;--acc2:#FFFFFF;--soft:#141414;
  --kraft:#6F8BFF;--lauf:#FF7A45;--swim:#36CFC9;--food:#6CCF5B;
}}
:root[data-theme=dark]{
  --bg:#000000;--surface:#000000;--sunk:#161616;--ink:#FFFFFF;--mute:#9A9A9A;--line:#2A2A2A;--hair:#FFFFFF;
  --acc:#FFFFFF;--on:#000000;--acc2:#FFFFFF;--soft:#141414;
  --kraft:#6F8BFF;--lauf:#FF7A45;--swim:#36CFC9;--food:#6CCF5B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.1px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(env(safe-area-inset-top) + 12px) 20px 11px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
header .brand{font-weight:800;font-size:16px;letter-spacing:-.3px}
header .wk{font-size:14px;color:var(--mute)}
main{padding:0 20px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:0 6px env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:520px}
nav button{flex:1;background:none;border:0;border-top:2px solid transparent;color:var(--mute);padding:8px 0 6px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:23px;height:23px}
nav button.on{color:var(--ink);border-top-color:var(--ink)}

.hero{padding:22px 0 4px}
.hero .date{color:var(--mute);font-size:15px}
.hero h1{margin:4px 0 0;font-size:40px;line-height:1.02;letter-spacing:-1.6px;font-weight:800}
.hero .sub{margin-top:8px;color:var(--mute);font-size:15px}
.lanes{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:20px 0 4px}
.lane{border-radius:8px;padding:8px 0 9px;text-align:center;border:1px solid var(--line);min-height:58px}
.lane .d{font-size:12px;color:var(--mute);font-weight:600}
.lane .k{font-size:11.5px;font-weight:700;margin-top:2px;line-height:1.2;padding:0 2px;hyphens:manual}
.lane .k span{display:block;font-weight:500;color:var(--mute)}
.lane.today{border:1.5px solid var(--hair)}
.lane.done{background:var(--acc);border-color:var(--acc);color:var(--on)}
.lane.done .d,.lane.done .k span{color:var(--on);opacity:.75}
.lane.rest .k{color:var(--mute);font-weight:500}

.sec{margin-top:30px}
.sec>h2{font-size:22px;letter-spacing:-.6px;margin:0 0 4px;font-weight:800;display:flex;align-items:center}
.sec>.lead{margin:0 0 12px;color:var(--mute);font-size:14px}
.group{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.group+.group{margin-top:12px}
.item{padding:15px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item .name{font-weight:650}
.item .rx{font-size:14px;white-space:nowrap;font-weight:600}
.item p{margin:5px 0 0;color:var(--mute);font-size:14px}
.sets{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.set{min-width:46px;height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:none;font-weight:700;color:var(--mute);transition:background .12s,color .12s,border-color .12s}
.set.done{background:var(--acc);border-color:var(--acc);color:var(--on)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border-radius:6px;padding:4px 9px;font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--ink)}
.chip.a{background:var(--acc);border-color:var(--acc);color:var(--on)}
.chip.b{border-color:var(--hair)}
.chip.w{background:var(--sunk);border-color:var(--sunk)}
.kg{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;border-bottom:1.5px solid var(--hair);padding-bottom:1px}
.callout{margin-top:14px;padding:12px 14px;border-left:2px solid var(--hair);background:var(--soft);border-radius:0 10px 10px 0;font-size:14px}
.callout b{color:var(--ink)}

.btn{border:0;border-radius:10px;padding:15px 16px;font-weight:700;font-size:16px;background:var(--acc);color:var(--on);width:100%;letter-spacing:-.2px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--hair)}
.btnrow{display:flex;gap:8px;margin-top:14px}
.seg{display:flex;border-bottom:1px solid var(--line);gap:18px;margin:6px 0 16px;overflow-x:auto}
.seg button{flex:none;border:0;background:none;padding:10px 0 9px;font-size:15px;font-weight:650;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.seg button.on{color:var(--ink);border-bottom-color:var(--ink)}
.form{padding:16px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mute);font-weight:600;margin:0 0 6px}
input,select,textarea{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:12px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--hair);outline:none;background:var(--bg)}

.kpis{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.kpi{padding:15px 16px;border-top:1px solid var(--line)}
.kpi:nth-child(-n+2){border-top:0}
.kpi:nth-child(odd){border-right:1px solid var(--line)}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.kpi .v small{font-size:15px;font-weight:600;color:var(--mute);margin-left:3px;letter-spacing:0}
.kpi .l{font-size:13px;color:var(--mute);margin-top:4px}
.panel{border:1px solid var(--line);border-radius:12px;padding:15px 14px 8px;margin-top:12px}
.panel h3{margin:0 2px;font-size:17px;font-weight:750;letter-spacing:-.3px}
.panel .note{margin:3px 2px 8px;font-size:13px;color:var(--mute)}
.panel .empty{padding:16px 2px 14px;color:var(--mute);font-size:14px}
svg.chart{width:100%;height:auto;display:block}
.chart text{font:600 11px var(--font);fill:var(--mute)}
.panel h3{display:flex;align-items:center}
.ring{display:flex;align-items:center;gap:16px;margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:12px}
.ring svg{flex:none}
.ring .t{font-weight:800;font-size:18px;letter-spacing:-.4px}
.ring .s{color:var(--mute);font-size:14px}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:10px 2px 8px}
.heat .col{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--sunk)}
.heat i.on{background:var(--kraft)}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 0;border-top:1px solid var(--line);vertical-align:top}
tr:first-child th,tr:first-child td{border-top:0}
th{color:var(--mute);font-weight:600}
td+td,th+th{padding-left:10px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:10px}
.entry .m{color:var(--mute);font-size:13px}
.x{border:1px solid var(--line);background:none;width:32px;height:32px;border-radius:8px;color:var(--mute);font-size:14px;flex:none}
ol,ul{margin:6px 0 0;padding-left:20px}li{margin:5px 0}
.hide{display:none}
.exrow{display:flex;align-items:center;gap:12px}
.exmain{flex:1;min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-size:14px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:650}
.setbars{display:inline-flex;gap:3px}
.setbars i{display:block;width:6px;height:14px;border-radius:2px;background:var(--kraft)}
.item.ex{transition:transform .32s cubic-bezier(.5,0,.75,0),opacity .32s,max-height .25s .3s,padding .25s .3s}
.item.ex.leaving{transform:translateX(110%);opacity:0}
.item.ex.gone{max-height:0!important;padding-top:0;padding-bottom:0;overflow:hidden}
.exdone .name{color:var(--mute);font-weight:550}
.exdone{display:flex;justify-content:space-between;align-items:center;padding-top:10px;padding-bottom:10px}
.check{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--hair);background:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0}
.check svg{opacity:.45}
.check:disabled{opacity:.35}
.prenote{margin-top:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--mute)}
.check:active{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}.check:active svg{opacity:1}
.item .top .check{align-self:center}
.opt{font-weight:500;color:var(--mute);font-size:13px;margin-left:4px}
.unit{transition:transform .38s cubic-bezier(.5,0,.75,0),opacity .38s,max-height .3s .3s,margin .3s .3s}
.unit.leaving{transform:translateX(110%);opacity:0}
.unit.gone{max-height:0!important;margin-top:0;overflow:hidden}
.donerow{display:flex;align-items:center;gap:10px}
.tick{width:26px;height:26px;border-radius:50%;background:var(--c,var(--ink));color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tick svg{width:15px;height:15px}
.undo{border:0;background:none;color:var(--mute);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.t-kraft{--c:var(--kraft)}.t-lauf{--c:var(--lauf)}.t-swim{--c:var(--swim)}.t-food{--c:var(--food)}.t-rest{--c:var(--line)}.t-ink{--c:var(--ink)}
.lane{position:relative;overflow:hidden}
.lane::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.lane.done{background:var(--c);border-color:var(--c);color:#fff}
.lane.done .d,.lane.done .k span{color:#fff}
.lane.done.t-rest{background:var(--sunk);color:var(--ink)}
.dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:10px}
.t-kraft .set.done{background:var(--kraft);border-color:var(--kraft);color:#fff}
.chip.c{background:var(--c);border-color:var(--c);color:#fff}
.group.side{border-left:3px solid var(--c)}
.kpi .l::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--c,var(--ink));margin-right:6px;vertical-align:1px}
.rule{padding:15px 16px;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule b{display:block;margin-bottom:3px}
.rule span{color:var(--mute);font-size:14px}
.inline{display:flex;gap:8px;margin-top:10px}
.inline input{flex:1}
.inline .btn{width:auto;padding:0 18px}
.info{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mute);font:italic 700 11px/1 Georgia,"Times New Roman",serif;padding:0;margin-left:7px;vertical-align:2px;display:inline-flex;align-items:center;justify-content:center}
.info:active{border-color:var(--hair);color:var(--ink)}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-bg.open{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:84vh;overflow:auto;border-radius:16px 16px 0 0;padding:10px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .22s;border-top:1px solid var(--line)}
.sheet-bg.open .sheet{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet h3{margin:0 0 8px;font-size:26px;letter-spacing:-.9px;font-weight:800;line-height:1.1}
.sheet .what{color:var(--mute);margin:0 0 6px}
.sheet h4{margin:18px 0 4px;font-size:15px;font-weight:750;padding-top:14px;border-top:1px solid var(--line)}
.sheet .close{margin-top:22px}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:16px;border:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><span class="brand">Projekt 1</span><span class="wk num" id="hdr"></span></header>
<main id="app"></main>
<nav><div class="in" id="nav">
  <button data-v="heute" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/></svg>Heute</button>
  <button data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</button>
  <button data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>Eintragen</button>
  <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>Statistik</button>
  <button data-v="mehr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18" cy="12" r="1.3" fill="currentColor"/></svg>Mehr</button>
</div></nav>

<script>
"use strict";
/* ================= Speicher ================= */
const KEY="projekt1.v1", DEFAULT_START="2026-11-23";
const blank=()=>({start:DEFAULT_START,test5k:null,logs:{weight:[],run5k:[],push:[],pull:[],runs:[],rhr:[]},done:{},sets:{}});
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
let S=Object.assign(blank(),load());
S.logs=Object.assign(blank().logs,S.logs||{});
if(!S.start)S.start=DEFAULT_START;
function applyTheme(){const t=S.theme||"auto",r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);
  const dark=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.querySelectorAll('meta[name=theme-color]').forEach(m=>{m.setAttribute("content",dark?"#000000":"#FFFFFF");m.removeAttribute("media")})}
applyTheme();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ================= Datum & Zahlen ================= */
const DAYS=["So","Mo","Di","Mi","Do","Fr","Sa"];
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function mondayOf(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x}
function weekNo(d){return Math.max(1,Math.floor((mondayOf(d)-mondayOf(parse(S.start)))/(7*864e5))+1)}
const fmtDate=d=>d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
const short=s=>parse(s).toLocaleDateString("de-DE",{day:"numeric",month:"numeric"});
function toSec(s){if(!s)return null;const p=String(s).trim().replace(",",":").split(":").map(Number);if(p.some(isNaN))return null;return p.length===2?p[0]*60+p[1]:p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===1?p[0]*60:null}
function mmss(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")}
const de=(n,d=1)=>Number(n).toLocaleString("de-DE",{maximumFractionDigits:d,minimumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);

/* ================= Paces ================= */
function best5k(){
  const c=[...S.logs.run5k.map(e=>e.v),...S.logs.runs.filter(r=>r.km>=4.95&&r.km<=5.2&&r.type==="test").map(r=>r.sec*5/r.km)];
  return c.length?Math.min(...c):null;
}
function paces(){
  const t=toSec(S.test5k)||1500,p=t/5;
  return {easy:mmss(p+60)+"–"+mmss(p+105),tempo:mmss(p+10)+"–"+mmss(p+20),interval:mmss(p-10)+"–"+mmss(p),known:!!toSec(S.test5k)};
}

/* ================= Plan ================= */
const isDeload=w=>w%4===0;
const isTest=w=>w===1||(w-1)%8===0;
const is10k=w=>w>=5&&(w-5)%8===0;
function phase(w){
  if(w<=4)return {name:"Technik",hint:"Ohne Rucksack, saubere Technik",a:null};
  if(w<=20)return {name:"Aufbau",hint:"Rucksack schrittweise bis 10–12 kg",a:null};
  if(w<=36)return {name:"Kraft",hint:"Rucksack 15–20 kg+, bei A nur 5–8 Wdh.",a:"5–8"};
  return {name:"Spezifisch",hint:"Montags Langhantel-Bankdrücken statt A",a:"5–8"};
}
const KRAFT={
 A:{name:"Kraft A",tag:"schwer, ca. 40 min",ex:[
  ["Liegestütze, Füße erhöht, mit Rucksack",4,"6–12","2 min"],
  ["Dips zwischen zwei Stühlen",3,"6–12","2 min"],
  ["Bulgarische Split Squats mit Rucksack",3,"8–12 je Bein","90 s"],
  ["Klimmzüge mit Rucksack (Schule)",3,"5–8","2 min"],
  ["Hollow Hold",3,"30–45 s","60 s"],
  ["Rumpfdrehbeugen",3,"20 (10 je Seite)","30 s"]]},
 B:{name:"Kraft B",tag:"Aufbau",ex:[
  ["Deficit-Liegestütze zwischen Stühlen",3,"8–15","90 s"],
  ["Pike-Liegestütze",3,"6–12","90 s"],
  ["Einbeiniges rumänisches Kreuzheben",3,"10 je Bein","90 s"],
  ["Tisch-Rudern",3,"10–15","90 s"],
  ["Nordic Curls, langsam ablassen",3,"3–6","2 min"],
  ["Rumpfdrehbeugen",3,"20 (10 je Seite)","30 s"]]},
 C:{name:"Kraft C",tag:"Volumen",ex:[
  ["Liegestütze mit Rucksack",3,"12–20","90 s"],
  ["Dips",3,"Max. minus 2","90 s"],
  ["Klimmzüge am Reck oder Tisch-Rudern",3,"Max. minus 2","2 min"],
  ["Ausfallschritte gehend mit Rucksack",3,"12 je Bein","90 s"],
  ["Liegendes Beinheben",3,"10–15","60 s"],
  ["Einbeiniges Wadenheben an einer Stufe",3,"15 je Bein","60 s"],
  ["Rumpfdrehbeugen",3,"20 (10 je Seite)","30 s"]]},
 BANK:{name:"Bankdrücken",tag:"Langhantel, mit Partner",ex:[
  ["Bankdrücken mit Langhantel",4,"5–8","2–3 min"],
  ["Dips",3,"6–12","2 min"],
  ["Bulgarische Split Squats mit Rucksack",3,"8–12 je Bein","90 s"],
  ["Klimmzüge mit Rucksack (Schule)",3,"5–8","2 min"],
  ["Rumpfdrehbeugen",3,"20 (10 je Seite)","30 s"]]}
};
const INFO={
 "Liegestütze, Füße erhöht, mit Rucksack":{w:"Liegestütze mit den Füßen auf einem Stuhl oder Bett. Dadurch liegt mehr Gewicht auf Brust, Schultern und Trizeps.",s:["Rucksack fest auf den Rücken schnallen, Hüftgurt zu.","Hände etwas breiter als schulterbreit auf den Boden, Füße auf den Stuhl.","Körper bildet eine gerade Linie, Bauch und Po anspannen.","Brust bis knapp über den Boden absenken, Ellenbogen etwa 45° vom Körper.","Kräftig hochdrücken, oben Arme fast strecken."],t:"Hängt die Hüfte durch, ist der Rucksack zu schwer."},
 "Dips zwischen zwei Stühlen":{w:"Drückübung für Trizeps, untere Brust und Schultern. Das ist die Heimversion von Barren-Dips.",s:["Zwei stabile Stühle Lehne an Lehne, etwas mehr als schulterbreit auseinander, am besten an eine Wand.","Hände auf die Lehnen, Arme gestreckt, Beine angewinkelt in der Luft.","Langsam absenken, bis die Oberarme etwa waagerecht sind.","Oberkörper leicht nach vorn neigen, dann hochdrücken."],t:"Vorher prüfen, dass nichts kippt. Zieht es vorne in der Schulter, nicht so tief gehen."},
 "Dips":{w:"Drückübung für Trizeps, untere Brust und Schultern, zwischen zwei stabilen Stühlen oder an einem Barren.",s:["Hände auf die Stützen, Arme gestreckt, Beine angewinkelt.","Absenken, bis die Oberarme etwa waagerecht sind.","Oberkörper leicht nach vorn, dann kräftig hochdrücken."],t:"Stühle an die Wand stellen, damit nichts wegrutscht."},
 "Bulgarische Split Squats mit Rucksack":{w:"Einbeinige Kniebeuge mit dem hinteren Fuß auf einem Stuhl. Trainiert Oberschenkel und Po, ganz ohne Hantel.",s:["Mit dem Rücken zum Stuhl stellen, einen Fußrücken hinten auf die Sitzfläche legen.","Vorderer Fuß so weit vorn, dass das Knie beim Absenken über dem Fuß bleibt.","Senkrecht absenken, bis der vordere Oberschenkel etwa waagerecht ist.","Über die Ferse des vorderen Fußes hochdrücken. Alle Wiederholungen, dann Beinwechsel."],t:"Wackelt es, halt dich anfangs leicht an einer Wand fest."},
 "Klimmzüge mit Rucksack (Schule)":{w:"Klimmzüge im Ristgriff (Handrücken zu dir) mit etwas Gewicht im Rucksack. Für Rücken und Bizeps.",s:["Rucksack auf, an die Stange hängen, Hände etwas breiter als schulterbreit.","Schultern nach unten ziehen, dann hochziehen, bis das Kinn über der Stange ist.","Kontrolliert ganz nach unten ablassen."],t:"Kein Schwung aus den Beinen. Wenn kein Rucksack geht: oben 1 s halten und 3 s ablassen."},
 "Hollow Hold":{w:"Statische Rumpfübung aus dem Turnen. Stärkt die ganze Bauchmuskulatur.",s:["Auf den Rücken legen, Arme lang über den Kopf.","Lendenwirbelsäule fest auf den Boden drücken.","Schultern und gestreckte Beine ein paar Zentimeter anheben, sodass der Körper eine flache Banane bildet.","Position halten und ruhig weiteratmen."],t:"Hebt sich der untere Rücken, Knie anwinkeln oder Arme neben den Körper legen."},
 "Deficit-Liegestütze zwischen Stühlen":{w:"Liegestütze mit den Händen auf zwei Stühlen oder Bücherstapeln. Du kommst tiefer als der Boden und dehnst die Brust stärker, das bringt mehr Muskelreiz.",s:["Zwei gleich hohe, stabile Erhöhungen schulterbreit hinstellen.","Hände darauf, Körper gerade, Rucksack auf dem Rücken.","Brust langsam zwischen die Hände absenken, so tief es angenehm geht.","Hochdrücken."],t:"Tiefe langsam steigern, die Schultern brauchen etwas Gewöhnung."},
 "Pike-Liegestütze":{w:"Liegestütze mit hochgestrecktem Po. Das verlagert die Arbeit auf die Schultern, ähnlich wie Schulterdrücken.",s:["Aus dem Liegestütz die Hüfte hochschieben, bis der Körper ein umgedrehtes V bildet.","Hände schulterbreit, Kopf zwischen den Armen.","Ellenbogen beugen und den Kopf vor die Hände Richtung Boden absenken.","Zurück hochdrücken."],t:"Zu leicht? Füße auf einen Stuhl stellen."},
 "Einbeiniges rumänisches Kreuzheben":{w:"Vorbeugen auf einem Bein mit fast gestrecktem Knie. Trainiert hintere Oberschenkel, Po und Gleichgewicht.",s:["Auf einem Bein stehen, Knie leicht gebeugt, Rucksack in der Gegenhand.","Hüfte nach hinten schieben und den Oberkörper nach vorn senken, das freie Bein geht gestreckt nach hinten.","Rücken bleibt gerade, bis du hinten im Oberschenkel Zug spürst.","Über den Po wieder aufrichten."],t:"Langsam bewegen, Gleichgewicht ist Teil der Übung."},
 "Tisch-Rudern":{w:"Umgekehrter Liegestütz unter einem stabilen Tisch. Die Gegenbewegung zu Liegestützen für Rücken und Bizeps.",s:["Unter einen massiven Tisch legen und die Tischkante schulterbreit greifen.","Körper gerade wie ein Brett, Fersen am Boden.","Brust zur Tischkante ziehen, Schulterblätter zusammen.","Langsam ablassen."],t:"Erst prüfen, dass der Tisch nicht kippen kann. Je flacher du liegst, desto schwerer."},
 "Nordic Curls, langsam ablassen":{w:"Eine der wirksamsten Übungen für die hinteren Oberschenkel. Sie senkt nachweislich das Risiko für Zerrungen.",s:["Auf ein Kissen knien, Fersen unter einem Sofa oder Bett einklemmen (oder jemand hält sie).","Körper von Knie bis Kopf gerade, Hüfte gestreckt.","So langsam wie möglich nach vorn kippen und mit den Oberschenkeln bremsen.","Mit den Händen auffangen und mit leichtem Abdrücken zurück in die Ausgangsposition."],t:"Am Anfang schafft fast niemand den ganzen Weg. Jede Sekunde Bremsen zählt."},
 "Liegestütze mit Rucksack":{w:"Normale Liegestütze mit Zusatzgewicht. Die wichtigste Übung, um dich aufs Bankdrücken vorzubereiten.",s:["Rucksack fest auf, Hände etwas breiter als schulterbreit.","Körper gerade, Bauch und Po angespannt.","Brust bis knapp über den Boden, Ellenbogen etwa 45° vom Körper.","Hochdrücken."],t:"Volle Bewegung zählt mehr als viele halbe Wiederholungen."},
 "Klimmzüge am Reck oder Tisch-Rudern":{w:"Samstags kommst du nicht an die Stange der Schule. Nimm ein Reck auf dem Spielplatz oder mach stattdessen Tisch-Rudern.",s:["Reck: Ristgriff, kontrolliert hoch bis zum Kinn über der Stange und ganz ablassen.","Ohne Reck: Tisch-Rudern, 3 Sätze bis kurz vor Schluss."],t:"Max. minus 2 heißt: 2 Wiederholungen weniger, als du maximal könntest."},
 "Ausfallschritte gehend mit Rucksack":{w:"Große Schritte nach vorn mit tiefem Absenken. Trainiert Beine und Po und schult die Stabilität beim Laufen.",s:["Rucksack auf, aufrecht stehen.","Großen Schritt nach vorn und das hintere Knie fast bis zum Boden senken.","Mit dem vorderen Bein hochdrücken und direkt den nächsten Schritt mit dem anderen Bein machen.","Im Flur oder Garten hin und zurück gehen."],t:"Oberkörper aufrecht, vorderes Knie zeigt in Richtung Fuß."},
 "Liegendes Beinheben":{w:"Bauchübung für den unteren Bauch. Sie ersetzt das hängende Knieheben, wenn keine Stange da ist.",s:["Auf den Rücken legen, Hände neben dem Po oder darunter.","Unteren Rücken auf den Boden drücken.","Gestreckte oder leicht gebeugte Beine bis senkrecht anheben.","Langsam absenken, ohne dass die Fersen den Boden berühren."],t:"Hohlkreuz vermeiden. Lieber die Knie stärker beugen."},
 "Einbeiniges Wadenheben an einer Stufe":{w:"Kräftigt Waden und Achillessehne. Das schützt beim Laufen vor typischen Überlastungen.",s:["Mit dem Fußballen eines Fußes auf eine Treppenstufe stellen, am Geländer festhalten.","Ferse langsam unter die Stufe absenken.","Auf die Zehenspitze hochdrücken, oben kurz halten.","Langsam wieder absenken."],t:"Das Absenken ruhig 2–3 Sekunden dauern lassen."},
 "Bankdrücken mit Langhantel":{w:"Die Übung, um die es am Ende geht: 50 kg × 10. Nur mit Partner zum Absichern oder in einem Rack mit Sicherheitsablagen.",s:["Auf die Bank legen, Augen unter der Stange, Füße fest auf dem Boden.","Stange etwas breiter als schulterbreit greifen, Schulterblätter zusammenziehen.","Stange kontrolliert zur unteren Brust senken, Ellenbogen 45–70° vom Körper.","Brust berühren und hochdrücken, bis die Arme gestreckt sind. Po bleibt auf der Bank."],t:"Die ersten Male mit einem Trainer oder jemandem, der die Technik kennt."},
 "Lockerer Lauf":{w:"Ruhiges Tempo, bei dem du dich in ganzen Sätzen unterhalten könntest. Das ist der größte und wichtigste Teil deines Lauftrainings.",s:["Bewusst langsamer laufen, als du denkst.","Auf der Watch soll der Puls ruhig bleiben, ungefähr unter 150–155."],t:"Locker ist nicht faul. Diese Läufe bauen die Ausdauer, die dich bei den harten Einheiten schnell macht."},
 "Langer Lauf":{w:"Dein längster Lauf der Woche, am Sonntag: deine 10 km, später etwas mehr, komplett im lockeren Tempo. Er baut Grundlagenausdauer auf und macht 5 km später leichter.",s:["Das Tempo so wählen, dass du dich unterhalten könntest.","Am Anfang 10 km, später bis 14 km. Die App zeigt dir auch, wie lange das ungefähr dauert.","Wasser trinken, wenn es über 60 Minuten geht."],t:"Nicht schneller werden, nur weil es sich gut anfühlt."},
 "Intervalle":{w:"Mehrere schnelle Abschnitte mit kurzen Trabpausen. Sie machen dich schneller und gewöhnen dich an das Zieltempo.",s:["10–15 min locker einlaufen.","Jeden Abschnitt gleichmäßig im angegebenen Tempo laufen, nicht den ersten zu schnell.","In der Pause langsam traben, nicht stehen bleiben.","10 min locker auslaufen."],t:"Auf der Apple Watch unter „Training“, „Eigenes Training“ anlegen, dann piept sie bei jedem Wechsel."},
 "Tempolauf":{w:"Ein längerer Abschnitt im angenehm harten Tempo. Hier lernst du, ein hohes Tempo lange zu halten.",s:["10–15 min locker einlaufen.","Den Tempoabschnitt gleichmäßig laufen: Sprechen geht nur noch in kurzen Worten.","10 min locker auslaufen."],t:"Am Ende solltest du das Gefühl haben, noch 5–10 Minuten weiterlaufen zu können."}
};
const BAND=[[4,0,0],[8,2,4],[12,4,6],[16,6,9],[20,8,12],[28,12,16],[36,15,20],[999,18,22]];
const RUCK={"Liegestütze, Füße erhöht, mit Rucksack":[.8,0],"Deficit-Liegestütze zwischen Stühlen":[.7,0],"Liegestütze mit Rucksack":[.6,0],
 "Bulgarische Split Squats mit Rucksack":[1,0],"Ausfallschritte gehend mit Rucksack":[.8,0],"Einbeiniges rumänisches Kreuzheben":[.6,0],
 "Klimmzüge mit Rucksack (Schule)":[.3,8],"Dips zwischen zwei Stühlen":[.4,8],"Dips":[.4,8]};
function ruckKg(name,w){
  const r=RUCK[name];if(!r)return null;
  if(w<=4||w<=r[1])return "Ohne Rucksack";
  const b=BAND.find(x=>w<=x[0]);let lo=Math.round(b[1]*r[0]),hi=Math.round(b[2]*r[0]);if(hi<=lo)hi=lo+1;if(lo<1)lo=1;
  return "Rucksack "+lo+"–"+hi+" kg";
}
INFO["Rumpfdrehbeugen"]={w:"Im Stehen abwechselnd mit einer Hand zum gegenüberliegenden Fuß drehen und beugen. Trainiert seitliche Bauchmuskeln, Rücken und Beweglichkeit und bringt den Puls hoch.",s:["Breitbeinig stehen, Füße deutlich weiter als schulterbreit, Knie leicht gebeugt.","Arme seitlich gestreckt auf Schulterhöhe.","Oberkörper drehen und nach vorn beugen, mit der rechten Hand den linken Fuß berühren. Der linke Arm zeigt nach oben.","Zurück in die Mitte, dann die linke Hand zum rechten Fuß.","Zügig, aber kontrolliert im Wechsel. Eine Berührung zählt als eine Wiederholung."],t:"Nicht ruckartig reißen. Kommst du nicht bis zum Fuß, reicht das Schienbein. Die Beweglichkeit kommt mit der Zeit."};
INFO["Satz-Kästchen"]={w:"Jedes Kästchen ist ein Satz. Bei „4 × 6–12“ hast du vier Kästchen für vier Sätze.",s:["Satz machen.","Kästchen antippen, es wird farbig.","Pause laut Angabe, dann der nächste Satz.","Sind alle Kästchen voll, kommt die nächste Übung."],t:"So verlierst du nie den Überblick, wie viele Sätze du schon hast. Wenn die ganze Einheit fertig ist, oben rechts den Haken antippen."};
INFO["10-km-Lauf auf Zeit"]={w:"Alle acht Wochen läufst du deine 10 km zügig auf Zeit statt des Tempolaufs. Er liegt immer direkt nach einer Entlastungswoche, damit du ausgeruht bist.",s:["15 min locker einlaufen.","10 km zügig und gleichmäßig. Starte etwas langsamer, als du denkst, und werde zum Ende schneller, wenn es geht.","10 min locker auslaufen.","Werte eintragen, die Zeit landet in der Statistik."],t:"Am Sonntag danach ist trotzdem der lange lockere Lauf. Lauf den dann wirklich ruhig."};
INFO["Wiegen"]={w:"Dein Gewicht schwankt am Tag um bis zu 1–2 kg, je nach Essen, Trinken und Toilette. Damit die Werte vergleichbar sind, wiegst du dich immer gleich.",s:["Montag, Mittwoch, Freitag und Sonntag.","Morgens direkt nach dem Aufstehen und nach der Toilette.","Vor dem Essen und Trinken.","In Unterwäsche, immer auf derselben Waage am selben Platz.","Wert sofort in der App eintragen."],t:"Einzelne Werte sind egal. Die App rechnet den Wochenschnitt aus, und nur der zählt."};
INFO["Krafttest"]={w:"Alle acht Wochen misst du am Mittwoch in etwa 15 Minuten, wie stark du geworden bist. Die Werte landen in der Statistik.",s:["Normal aufwärmen: 8–10 min rudern, dann 10 lockere Liegestütze.","Liegestütze-Test: mit dem angegebenen Rucksack-Gewicht so viele saubere Wiederholungen wie möglich. Brust bis eine Faust über dem Boden, oben Arme gestreckt, Körper gerade.","3 Minuten Pause.","Klimmzug-Test in der Schule: aus dem toten Hang, Ristgriff, Kinn über die Stange, kein Schwung. So viele wie möglich.","Mehr nicht. Der Rest des Tages bleibt frei."],t:"Der Test liegt am Mittwoch, zwei Tage nach Kraft A. So bist du ausgeruht und schaffst deinen echten Bestwert. Gezählt wird nur, was sauber war."};
INFO["5-km-Test"]={w:"Alle acht Wochen läufst du 5 km auf Zeit. Daraus berechnet die App deine Laufgeschwindigkeiten neu.",s:["Flache Strecke oder Bahn, am besten immer dieselbe.","15 min locker einlaufen, dabei 3 Steigerungen über 15–20 Sekunden.","5 km so schnell, wie du gleichmäßig durchhältst. Der erste Kilometer nicht schneller als der Rest.","10 min locker auslaufen.","Unten Distanz, Zeit und Puls eintragen und Art „5-km-Test“ lassen."],t:"Am Vortag ist Ruhe oder nur Krafttraining, also bist du ausgeruht."};
INFO["Rucksack-Gewicht"]={w:"Der Rucksack ersetzt die Hantel. Bei jeder Übung zeigt die App, wie viel Gewicht diese Woche ungefähr hinein soll. Der Wert steigt mit den Wochen automatisch.",s:["Rucksack einmal leer und einmal gepackt auf die Personenwaage stellen, oder dich mit und ohne Rucksack wiegen. Die Differenz ist das Gewicht.","Füllen mit Wasserflaschen (1 l = 1 kg), Büchern oder einer Tüte Reis (1 kg). Alles fest packen, damit nichts rutscht.","Hüft- und Brustgurt schließen, das Gewicht soll eng am Rücken liegen.","Fang am unteren Ende des Bereichs an. Schaffst du in allen Sätzen die obere Wiederholungszahl, beim nächsten Mal 1–2 kg mehr.","Schaffst du die untere Wiederholungszahl nicht sauber, nimm 1–2 kg raus. Die Wiederholungen sind wichtiger als die Zahl auf dem Rucksack."],t:"Bei Füßen erhöht und Deficit-Liegestützen ist weniger Gewicht nötig, weil die Übung schon schwerer ist. Das ist im Wert schon eingerechnet."};
function infoBtn(k){return INFO[k]?`<button class="info" data-info="${esc(k)}" aria-label="Erklärung zu ${esc(k)}">i</button>`:""}
function openInfo(k){
  const i=INFO[k];if(!i)return;
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(k)}"><div class="grab"></div><h3>${esc(k)}</h3><p class="what">${esc(i.w)}</p><h4>So geht's</h4><ol>${i.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${i.t?`<h4>Tipp</h4><p style="margin:4px 0 0">${esc(i.t)}</p>`:""}<button class="btn ghost close">Schließen</button></div>`;
  const close=()=>{bg.classList.remove("open");setTimeout(()=>bg.remove(),200);document.removeEventListener("keydown",esc_)};
  const esc_=e=>{if(e.key==="Escape")close()};
  bg.addEventListener("click",e=>{if(e.target===bg||e.target.closest(".close"))close()});
  document.addEventListener("keydown",esc_);
  document.body.appendChild(bg);requestAnimationFrame(()=>bg.classList.add("open"));bg.querySelector(".close").focus();
}
function runFor(w,type){
  const P=paces(),dl=isDeload(w),ph=w<=4?0:w<=16?1:w<=36?2:3;
  if(type==="int"){
    if(ph===0||dl)return {t:"Lockerer Lauf",run:"easy",d:"30 min locker"+(ph===0?", danach 6 × 20 s Steigerungen":""),pace:P.easy,note:dl?"Entlastungswoche: keine Intervalle":null};
    const v=[null,"6–10 × 400 m, 90 s Trabpause","5–6 × 1000 m, 2 min Trabpause","3 × 1600 m, 3 min Pause"][ph];
    return {t:"Intervalle",run:"int",d:"10–15 min einlaufen, "+v+", 10 min auslaufen",pace:ph===3?"Zielpace 4:36 oder schneller":P.interval};
  }
  if(type==="tempo"){
    if(ph===0||dl)return {t:"Lockerer Lauf",run:"easy",d:"30–40 min locker",pace:P.easy,note:dl?"Entlastungswoche":null};
    const v=[null,"15–20 min am Stück","20–25 min oder 3 × 10 min","25 min am Stück"][ph];
    return {t:"Tempolauf",run:"tempo",d:"10–15 min einlaufen, "+v+", 10 min auslaufen",pace:P.tempo};
  }
  if(type==="long"){const km=dl?[7,7,8,7][ph]:[10,[10,11,12][Math.min(2,Math.floor((w-5)/4))],[12,13,14,14,14][Math.min(4,Math.floor((w-17)/4))],12][ph];
    const t=toSec(S.test5k)||1500,p=t/5,lo=Math.round(km*(p+60)/60),hi=Math.round(km*(p+105)/60);
    return {t:"Langer Lauf",run:"long",d:km+" km locker, etwa "+lo+"–"+hi+" min"+(dl?" (Entlastungswoche, kürzer als sonst)":""),pace:P.easy}}
  if(type==="easy"){if(ph===0)return null;return {t:"Lockerer Lauf",run:"easy",d:"30–40 min locker, am Ende 4–6 Steigerungen",pace:P.easy}}
}
function dayPlan(d){
  const w=weekNo(d),wd=d.getDay(),items=[];
  const kraft=k=>{const key=(k==="A"&&w>=37)?"BANK":k;items.push({kind:"kraft",key})};
  const run=t=>{const r=runFor(w,t);if(r)items.push(Object.assign({kind:"run"},r))};
  switch(wd){
    case 1:kraft("A");items.push({kind:"swim"});break;
    case 2:run("int");break;
    case 3:if(isTest(w))items.push({kind:"test"});else items.push({kind:"rest",opt:true});break;
    case 4:kraft("B");run("easy");break;
    case 5:if(isTest(w)){const P=paces();items.push({kind:"run",t:"5-km-Test",run:"test",d:"15 min einlaufen mit 3 kurzen Steigerungen, dann 5 km so schnell, wie du gleichmäßig durchhältst, 10 min auslaufen",pace:"gleichmäßig, am Limit"})}else if(is10k(w)){items.push({kind:"run",t:"10-km-Lauf auf Zeit",run:"test10",d:"15 min einlaufen, dann 10 km zügig und gleichmäßig auf Zeit, 10 min auslaufen",pace:"zügig, gleichmäßig"})}else run("tempo");break;
    case 6:kraft("C");items.push({kind:"swim"});break;
    case 0:run("long");break;
  }
  return {w,dl:isDeload(w),ph:phase(w),items};
}
function titleOf(it){return it.kind==="kraft"?KRAFT[it.key].name:it.kind==="run"?it.t:it.kind==="swim"?"Schwimmen":it.kind==="test"?"Krafttest":"Ruhetag"}
function laneType(d){const it=dayPlan(d).items;return it.some(i=>i.kind==="kraft")?"kraft":it.some(i=>i.kind==="run")?"lauf":it.some(i=>i.kind==="test")?"ink":"rest"}
function laneLabel(d){
  const all=dayPlan(d).items;if(all.length===1&&all[0].kind==="test")return "Kraft&shy;test";
  const it=all.filter(i=>i.kind!=="swim"&&i.kind!=="test");
  const lab=i=>i.kind==="kraft"?(i.key==="BANK"?"Bank&shy;drücken":"Kraft "+i.key):i.kind==="rest"?"Ruhe":({int:"Inter&shy;valle",tempo:"Tempo",long:"Langer Lauf",easy:"Locker",test:"5-km-Test",test10:"10 km Zeit"})[i.run];
  return it.length>1?lab(it[0])+"<span>+ Lauf</span>":lab(it[0]);
}
const trainingDays=d=>{const m=mondayOf(d);let n=0;for(let i=0;i<7;i++){const x=new Date(m);x.setDate(m.getDate()+i);if(dayPlan(x).items.some(t=>t.kind!=="rest"))n++}return n};

/* ================= Charts ================= */
const W=340;
function lineChart(pts,{fmt=v=>de(v),goal=null,goalLabel="",invert=false,h=150,color="var(--acc)",id="g"+Math.random().toString(36).slice(2,7)}={}){
  if(pts.length<2)return null;
  pts=[...pts].sort((a,b)=>a.date<b.date?-1:1);
  const L=38,R=10,T=12,B=22,xs=pts.map(p=>parse(p.date).getTime()),ys=pts.map(p=>p.v);
  let y0=Math.min(...ys,goal??Infinity),y1=Math.max(...ys,goal??-Infinity);if(y0===y1){y0-=1;y1+=1}
  const pad=(y1-y0)*.12;y0-=pad;y1+=pad;
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const X=t=>L+(W-L-R)*((t-x0)/((x1-x0)||1));
  const Y=v=>invert?T+(h-T-B)*((v-y0)/(y1-y0)):h-B-(h-T-B)*((v-y0)/(y1-y0));
  const line=pts.map((p,i)=>(i?"L":"M")+X(xs[i]).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const base=h-B;
  const area=line+` L${X(xs[xs.length-1]).toFixed(1)} ${base} L${X(xs[0]).toFixed(1)} ${base} Z`;
  const ticks=[0,.5,1].map(f=>y0+pad+(y1-y0-2*pad)*f);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" role="img"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".14"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
  ticks.forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`});
  if(goal!=null)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="5 4"/><text x="${W-R}" y="${Y(goal)-5}" text-anchor="end" style="fill:var(--ink)">${goalLabel}</text>`;
  s+=`<path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${X(xs[i])}" cy="${Y(p.v)}" r="${i===pts.length-1?4:2.5}" fill="${i===pts.length-1?color:"var(--surface)"}" stroke="${color}" stroke-width="2"/>`});
  s+=`<text x="${L}" y="${h-5}">${short(pts[0].date)}</text><text x="${W-R}" y="${h-5}" text-anchor="end">${short(pts[pts.length-1].date)}</text></svg>`;

}
function barChart(bars,{h=150,fmt=v=>de(v,0),color="var(--acc)"}={}){
  const L=10,R=10,T=18,B=22,max=Math.max(1,...bars.map(b=>b.v)),n=bars.length,gw=(W-L-R)/n,bw=Math.min(26,gw*.62);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" role="img"><line x1="${L}" x2="${W-R}" y1="${h-B}" y2="${h-B}" stroke="var(--line)"/>`;
  bars.forEach((b,i)=>{const bh=(h-T-B)*(b.v/max),x=L+gw*i+(gw-bw)/2,y=h-B-bh,last=i===n-1;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,b.v?2:0)}" rx="3" fill="${last?color:"color-mix(in srgb, "+color+" 22%, transparent)"}"/>`;
    if(b.v)s+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle">${fmt(b.v)}</text>`;
    s+=`<text x="${x+bw/2}" y="${h-6}" text-anchor="middle">${b.l}</text>`});
  return s+`</svg>`;
}
function ringSvg(frac,size=64){
  const r=size/2-6,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--kraft)" stroke-width="5" stroke-linecap="butt" stroke-dasharray="${c*Math.min(1,frac)} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}

function exItems(it,dk,dl,live,T){
  const key=it.key,skip=it.skip||[];
  const done=(T.ex||{})[dk]||{},ph=phase(weekNo(parse(dk)));
  let open="",fin="";
  KRAFT[key].ex.forEach((e,i)=>{
    if(skip.includes(i))return;
    const n=dl?Math.max(1,Math.ceil(e[1]/2)):e[1];
    const reps=(key==="A"&&i===0&&ph.a)?ph.a:e[2];
    if(done[i]){fin+=`<div class="item exdone"><div class="donerow"><span class="tick">${CHECK_SVG}</span><span class="name">${esc(e[0])}</span></div><button class="undo" data-exundo="${i}">Rückgängig</button></div>`;return}
    const k=ruckKg(e[0],weekNo(parse(dk)));
    const bars=Array.from({length:n},()=>'<i></i>').join("");
    open+=`<div class="item ex" data-ex="${i}"><div class="exrow"><div class="exmain">
      <div class="top"><span class="name">${esc(e[0])}${infoBtn(e[0])}</span></div>
      <div class="meta"><span class="setbars" aria-hidden="true">${bars}</span><b class="num">${n} Sätze × ${esc(reps)}</b><span>Pause ${e[3]}</span></div>

      <button class="check" data-excheck="${i}" aria-label="${esc(e[0])} abhaken">${CHECK_SVG}</button></div></div>`;
  });
  return open+fin;
}

const RUNTYPE={easy:"Locker",long:"Lang",tempo:"Tempo",int:"Intervalle",test:"5-km-Test",test10:"10 km auf Zeit"};
function vLog(){
  const tabs=[["lauf","Lauf"],["gewicht","Gewicht"],["kraft","Kraft"]];
  let h=`<div class="hero"><h1>Eintragen</h1><div class="sub">Werte aus der Fitness-App übernehmen</div></div>
    <div class="seg">${tabs.map(t=>`<button data-lt="${t[0]}" class="${logTab===t[0]?"on":""}">${t[1]}</button>`).join("")}</div>`;
  const dateField=`<div class="full"><label for="ld">Datum</label><input type="date" id="ld" value="${iso(new Date())}"></div>`;
  let form="",list=[];
  if(logTab==="lauf"){
    form=`<div class="group"><div class="form"><div class="f">${dateField}</div></div>${runForm("l",null)}<div class="form" style="padding-top:0"><button class="btn" id="saveRun" data-p="l">Lauf speichern</button></div></div>`;
    list=S.logs.runs.map((r,i)=>({date:r.date,html:`<div><div class="name">${RUNTYPE[r.type]||"Lauf"}, ${de(r.km,2)} km</div><div class="m num">${short(r.date)}, ${mmss(r.sec)}, ${mmss(r.sec/r.km)} /km${r.avg?", Ø "+r.avg+" bpm":""}${r.max?", max. "+r.max:""}</div></div>`,del:"runs|"+i}));
  }else if(logTab==="gewicht"){
    form=`<div class="group"><div class="form"><div class="f">${dateField}<div class="full"><label for="lv">Gewicht (kg)</label><input id="lv" inputmode="decimal" placeholder="z. B. 58,4"></div></div><div class="btnrow"><button class="btn" id="saveSimple" data-k="weight">Gewicht speichern</button></div></div></div>`;
    list=S.logs.weight.map((e,i)=>({date:e.date,html:`<div><div class="name num">${de(e.v)} kg</div><div class="m">${short(e.date)}</div></div>`,del:"weight|"+i}));
  }else if(logTab==="kraft"){
    form=`<div class="group"><div class="form"><div class="f">${dateField}
      <div><label for="lpush">Liegestütze (Wdh.)</label><input id="lpush" inputmode="numeric" placeholder="Maximum"></div>
      <div><label for="lkg">Rucksack (kg)</label><input id="lkg" inputmode="decimal" placeholder="0"></div>
      <div class="full"><label for="lpull">Klimmzüge (Wdh.)</label><input id="lpull" inputmode="numeric" placeholder="Maximum, optional"></div></div>
      <div class="btnrow"><button class="btn" id="saveKraft">Test speichern</button></div></div></div>`;
    list=[...S.logs.push.map((e,i)=>({date:e.date,html:`<div><div class="name num">${e.v} Liegestütze mit ${de(e.kg||0,1)} kg</div><div class="m">${short(e.date)}</div></div>`,del:"push|"+i})),
          ...S.logs.pull.map((e,i)=>({date:e.date,html:`<div><div class="name num">${e.v} Klimmzüge</div><div class="m">${short(e.date)}</div></div>`,del:"pull|"+i}))];
  }else{
    form=`<div class="group"><div class="form"><div class="f">${dateField}<div class="full"><label for="lv">Ruhepuls (bpm)</label><input id="lv" inputmode="numeric" placeholder="aus der Fitness- oder Health-App"></div></div><div class="btnrow"><button class="btn" id="saveSimple" data-k="rhr">Ruhepuls speichern</button></div></div></div>`;
    list=S.logs.rhr.map((e,i)=>({date:e.date,html:`<div><div class="name num">${e.v} bpm</div><div class="m">${short(e.date)}</div></div>`,del:"rhr|"+i}));
  }
  list.sort((a,b)=>a.date<b.date?1:-1);
  h+=form+`<div class="sec"><h2>Letzte Einträge</h2>${list.length?`<div class="group">${list.slice(0,30).map(e=>`<div class="item entry">${e.html}<button class="x" data-del="${e.del}" aria-label="Eintrag löschen">✕</button></div>`).join("")}</div>`:`<div class="lead">Noch nichts eingetragen.</div>`}</div>`;

/* ---------- Statistik ---------- */
function weeklyAvg(arr){const m={};arr.forEach(e=>{const k=iso(mondayOf(parse(e.date)));(m[k]=m[k]||[]).push(e.v)});return Object.keys(m).sort().map(k=>({date:k,v:m[k].reduce((a,b)=>a+b,0)/m[k].length}))}
function vStats(){
  const now=new Date(),mon=mondayOf(now);
  const runs=S.logs.runs;
  const kmWeek=runs.filter(r=>parse(r.date)>=mon).reduce((a,r)=>a+r.km,0);
  const doneWeek=Object.keys(S.done).filter(k=>parse(k)>=mon).length, plannedWeek=trainingDays(now);
  const ww=weeklyAvg(S.logs.weight);
  const wDelta=ww.length>=2?ww[ww.length-1].v-ww[0].v:null;
  const b5=best5k();
  let h=`<div class="hero"><h1>Statistik</h1></div>`;
  h+=`<div class="ring">${ringSvg(plannedWeek?doneWeek/plannedWeek:0)}<div><div class="t num">${doneWeek} von ${plannedWeek} Einheiten</div><div class="s">diese Woche abgeschlossen</div></div></div>`;
  h+=`<div class="kpis" style="margin-top:12px">
    <div class="kpi t-lauf"><div class="v num">${de(kmWeek)}<small>km</small></div><div class="l">gelaufen diese Woche</div></div>
    <div class="kpi t-lauf"><div class="v num">${b5?mmss(b5):"–"}</div><div class="l">5-km-Bestzeit</div></div>
    <div class="kpi t-food"><div class="v num">${ww.length?de(ww[ww.length-1].v):"–"}<small>kg</small></div><div class="l">Gewicht, Wochenschnitt</div></div>
    <div class="kpi t-food"><div class="v num">${wDelta!=null?(wDelta>=0?"+":"")+de(wDelta):"–"}<small>kg</small></div><div class="l">seit dem ersten Eintrag</div></div></div>`;
  // Konstanz-Heatmap
  const start12=new Date(mon);start12.setDate(mon.getDate()-77);let cols="";
  for(let w=0;w<12;w++){let c="";for(let d=0;d<7;d++){const x=new Date(start12);x.setDate(start12.getDate()+w*7+d);const k=iso(x);c+=`<i class="${x>now?"fut":S.done[k]?"on":""}" title="${short(k)}"></i>`}cols+=`<div class="col">${c}</div>`}
  h+=panel("Konstanz","Abgeschlossene Trainingstage der letzten 12 Wochen, jede Spalte eine Woche",`<div class="heat">${cols}</div>`);
  // Wochenkilometer
  const bars=[];for(let i=7;i>=0;i--){const a=new Date(mon);a.setDate(mon.getDate()-7*i);const b=new Date(a);b.setDate(a.getDate()+7);
    bars.push({l:i===0?"jetzt":"KW"+kw(a),v:runs.filter(r=>{const t=parse(r.date);return t>=a&&t<b}).reduce((s,r)=>s+r.km,0)})}
  h+=panel("Wochenkilometer","Die letzten acht Wochen",bars.some(b=>b.v)?barChart(bars,{fmt:v=>de(v,0),color:"var(--lauf)"}):null,"t-lauf");
  // 5 km
  const t5=[...S.logs.run5k.map(e=>({date:e.date,v:e.v})),...runs.filter(r=>r.type==="test"&&r.km>=4.95&&r.km<=5.2).map(r=>({date:r.date,v:r.sec*5/r.km}))];
  h+=panel("5-km-Zeit","Tiefer ist besser. Die Linie zeigt das Ziel von 23:00.",lineChart(t5,{fmt:mmss,goal:1380,goalLabel:"23:00",invert:true,color:"var(--lauf)"}),"t-lauf");
  const t10=runs.filter(r=>r.type==="test10"&&r.km>=9.8&&r.km<=10.4).map(r=>({date:r.date,v:r.sec*10/r.km}));
  h+=panel("10-km-Zeit","Deine Läufe auf Zeit. Tiefer ist besser.",lineChart(t10,{fmt:mmss,invert:true,color:"var(--lauf)"}),"t-lauf");
  // Gewicht
  h+=panel("Körpergewicht","Wochenschnitt. Ziel: 0,15–0,3 kg pro Woche mehr.",lineChart(ww,{fmt:v=>de(v),color:"var(--food)"})+weightAdvice(ww),"t-food");
  // Effizienz
  const eff=runs.filter(r=>(r.type==="easy"||r.type==="long")&&r.avg>0&&r.km>0).map(r=>({date:r.date,v:(r.km*1000/(r.sec/60))/r.avg}));
  h+=panel("Lauf-Effizienz","Meter pro Herzschlag bei lockeren Läufen. Steigt die Linie, läufst du bei gleichem Puls schneller.",lineChart(eff,{fmt:v=>de(v,2),color:"var(--lauf)"}),"t-lauf");
  // Ø HF lockere Läufe
  const hr=runs.filter(r=>r.avg>0).map(r=>({date:r.date,v:r.avg}));
  h+=panel("Ø Herzfrequenz pro Lauf","Alle Läufe mit Pulswert",lineChart(hr,{fmt:v=>de(v,0),color:"var(--lauf)"}),"t-lauf");
  // Kraft
  h+=panel("Liegestütze mit Rucksack","Rucksack-Gewicht bei deinen Maximaltests. Steigt die Linie, wirst du stärker.",pushChart(),"t-kraft");
  h+=panel("Klimmzüge","Maximale Wiederholungen",lineChart(S.logs.pull,{fmt:v=>de(v,0),color:"var(--kraft)"}),"t-kraft");
  return h;
}
function kw(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function weightAdvice(ww){
  if(ww.length<2)return "";
  const d=ww[ww.length-1].v-ww[ww.length-2].v;
  let c="b",t="Im Zielbereich. So weiter.";
  if(d<0.15){c="w";t="Zu langsam: 200–300 kcal mehr am Tag, zum Beispiel ein Käsebrot und eine Handvoll Nüsse."}
  if(d>0.4){c="w";t="Zu schnell: etwa 200 kcal weniger am Tag."}
  return `<div class="chips" style="margin:4px 2px 8px"><span class="chip ${c} num">${d>=0?"+":""}${de(d,2)} kg zur Vorwoche</span></div><div class="note">${t}</div>`;
}
function rhrAdvice(){
  const a=[...S.logs.rhr].sort((x,y)=>x.date<y.date?-1:1);if(a.length<7)return "";
  const last=a.slice(-3).reduce((s,e)=>s+e.v,0)/3,base=a.slice(0,-3).slice(-14).reduce((s,e,_,arr)=>s+e.v/arr.length,0);
  return last-base>=5?`<div class="callout"><b>Ruhepuls erhöht:</b> Die letzten drei Tage liegen ${de(last-base,0)} Schläge über deinem Schnitt. Mach diese Woche zur Entlastungswoche.</div>`:"";
}
function pushChart(){
  const pts=[...S.logs.push].sort((a,b)=>a.date<b.date?-1:1);
  const svg=lineChart(pts.map(p=>({date:p.date,v:p.kg||0})),{fmt:v=>de(v,0)+" kg",color:"var(--kraft)"});
  if(!svg)return null;
  const l=pts[pts.length-1];
  return svg+`<div class="chips" style="margin:4px 2px 8px"><span class="chip a num">Zuletzt ${l.v} × mit ${de(l.kg||0,0)} kg</span></div>`;
}

/* ================= Render & Events ================= */
function render(){
  header();
  $("#app").innerHTML=({heute:vHeute,plan:vPlan,log:vLog,stats:vStats,mehr:vMehr})[view]();
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
}
function readRun(p){
  const km=parseFloat(($("#"+p+"km").value||"").replace(",",".")),sec=toSec($("#"+p+"t").value);
  if(!(km>0)||!sec){alert("Bitte Distanz und Zeit eintragen, z. B. 6,2 und 34:10.");return null}
  const avg=parseInt($("#"+p+"a").value)||null,max=parseInt($("#"+p+"m").value)||null;
  return {km,sec,avg,max,type:$("#"+p+"type").value};
}
function addRun(r,date){
  r.date=date;S.logs.runs.push(r);
  if(r.type==="test"&&r.km>=4.95&&r.km<=5.2){const t=r.sec*5/r.km;S.test5k=mmss(t)}
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b){view=b.dataset.v;render();window.scrollTo(0,0)}});
$("#app").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.info){openInfo(t.dataset.info);return}
  if(t.dataset.theme){S.theme=t.dataset.theme;save();applyTheme();render();return}
  if(t.dataset.excheck!=null){
    const {pre,dk,T}=viewCtx(),i=+t.dataset.excheck,it=dayPlan(parse(dk)).items.find(x=>x.kind==="kraft");
    T.ex=T.ex||{};T.ex[dk]=T.ex[dk]||{};T.ex[dk][i]=true;
    const allDone=kraftIdx(it).every(j=>T.ex[dk][j]);
    if(allDone){T.items=T.items||{};T.items[dk]=T.items[dk]||{};T.items[dk].kraft=true;syncDone(dk,T)}
    if(!pre)save();
    const el=t.closest(".item");t.style.background="var(--kraft)";t.style.borderColor="var(--kraft)";t.style.color="#fff";t.querySelector("svg").style.opacity=1;
    if(matchMedia("(prefers-reduced-motion: reduce)").matches){render();return}
    el.style.maxHeight=el.scrollHeight+"px";
    requestAnimationFrame(()=>{el.classList.add("leaving");setTimeout(()=>el.classList.add("gone"),330);
      setTimeout(()=>{if(allDone){const u=document.querySelector('.unit[data-u="kraft"]');if(u){u.style.maxHeight=u.scrollHeight+"px";u.classList.add("leaving");setTimeout(()=>u.classList.add("gone"),380);setTimeout(render,700);return}}render()},600)});
    return}
  if(t.dataset.exundo!=null){const {pre,dk,T}=viewCtx();if(T.ex&&T.ex[dk])delete T.ex[dk][t.dataset.exundo];if(T.items&&T.items[dk])delete T.items[dk].kraft;syncDone(dk,T);if(!pre)save();render();return}
  if(t.dataset.check){
    const u=t.dataset.check,{pre,dk,T}=viewCtx();
    if(!pre&&u==="run"&&$("#rkm")&&$("#rkm").value){const r=readRun("r");if(!r)return;addRun(r,dk)}
    if(!pre&&u==="test"){const pp=parseInt($("#tp").value),k=parseFloat(($("#tk").value||"0").replace(",","."))||0,q=parseInt($("#tq").value);
      if(!isNaN(pp))S.logs.push.push({date:dk,v:pp,kg:k});if(!isNaN(q))S.logs.pull.push({date:dk,v:q})}
    T.items=T.items||{};T.items[dk]=T.items[dk]||{};T.items[dk][u]=true;syncDone(dk,T);if(!pre)save();
    const el=t.closest(".unit");
    if(el&&!matchMedia("(prefers-reduced-motion: reduce)").matches){el.style.maxHeight=el.scrollHeight+"px";t.style.background="var(--c,var(--ink))";t.style.borderColor="var(--c,var(--ink))";t.style.color="#fff";t.querySelector("svg").style.opacity=1;
      requestAnimationFrame(()=>{el.classList.add("leaving");setTimeout(()=>el.classList.add("gone"),380);setTimeout(render,700)})}
    else render();
    return}
  if(t.dataset.uncheck){const {pre,dk,T}=viewCtx();if(T.items&&T.items[dk])delete T.items[dk][t.dataset.uncheck];if(t.dataset.uncheck==="kraft"&&T.ex)delete T.ex[dk];syncDone(dk,T);if(!pre)save();render();return}
  if(t.id==="qwSave"){const v=parseFloat(($("#qw").value||"").replace(",","."));if(isNaN(v))return;S.logs.weight.push({date:iso(new Date()),v});save();render();return}
  if(t.id==="testSave"){const d=iso(new Date()),pp=parseInt($("#tp").value),k=parseFloat(($("#tk").value||"0").replace(",","."))||0,q=parseInt($("#tq").value);
    if(!isNaN(pp))S.logs.push.push({date:d,v:pp,kg:k});if(!isNaN(q))S.logs.pull.push({date:d,v:q});save();t.textContent="Gespeichert";return}
  if(t.dataset.set){const [dk,id]=t.dataset.set.split("|");S.sets[dk]=S.sets[dk]||{};S.sets[dk][id]=!S.sets[dk][id];save();t.classList.toggle("done");return}
  if(t.id==="dayDone"){
    const dk=iso(new Date());
    if(S.done[dk]){delete S.done[dk];save();render();return}
    if($("#rkm")&&$("#rkm").value){const r=readRun("r");if(!r)return;addRun(r,dk)}
    S.done[dk]=true;save();render();return}
  if(t.dataset.pt){planTab=t.dataset.pt;render();return}
  if(t.dataset.lt){logTab=t.dataset.lt;render();return}
  if(t.id==="saveRun"){const r=readRun("l");if(!r)return;addRun(r,$("#ld").value||iso(new Date()));save();render();return}
  if(t.id==="saveSimple"){const v=parseFloat(($("#lv").value||"").replace(",","."));if(isNaN(v))return;S.logs[t.dataset.k].push({date:$("#ld").value||iso(new Date()),v});save();render();return}
  if(t.id==="saveKraft"){const d=$("#ld").value||iso(new Date()),p=parseInt($("#lpush").value),k=parseFloat(($("#lkg").value||"0").replace(",","."))||0,q=parseInt($("#lpull").value);
    if(!isNaN(p))S.logs.push.push({date:d,v:p,kg:k});if(!isNaN(q))S.logs.pull.push({date:d,v:q});save();render();return}
  if(t.dataset.del){const [k,i]=t.dataset.del.split("|");S.logs[k].splice(+i,1);save();render();return}
  if(t.id==="saveSet"){const v=$("#st2").value;if(v)S.start=iso(mondayOf(parse(v)));const tt=$("#t52").value.trim();if(tt===""||toSec(tt))S.test5k=tt?mmss(toSec(tt)):null;save();render();return}
  if(t.id==="exp"){const io=$("#io");io.classList.remove("hide");io.value=JSON.stringify(S);io.select();try{navigator.clipboard.writeText(io.value)}catch(_){}return}
  if(t.id==="imp"){const io=$("#io");io.classList.remove("hide");io.value="";$("#impGo").classList.remove("hide");io.focus();return}
  if(t.id==="impGo"){try{const o=JSON.parse($("#io").value);if(!o||typeof o!=="object")throw 0;S=Object.assign(blank(),o);S.logs=Object.assign(blank().logs,o.logs||{});save();render()}catch(_){alert("Das sind keine gültigen Exportdaten.")}return}
});
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
